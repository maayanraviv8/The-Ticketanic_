spring:
  datasource:
    url: jdbc:h2:mem:ticketanic;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true

ticketanic:
  security:
    jwt:
      secret: dev-secret-not-for-prod-must-be-long-enough-for-hmac-sha-256-key
  external:
    payment:
      enabled: false
    ticket-issuance:
      enabled: false
